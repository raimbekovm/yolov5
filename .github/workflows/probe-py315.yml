name: Probe Python 3.15 DataLoader workers
on:
  push:
    branches: [probe-py315]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python-version: "3.15.0" }
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.15.0" }
          - { os: ubuntu-latest, python-version: "3.15.0" }
    steps:
      - uses: actions/checkout@v7
      - uses: ultralytics/actions/setup-uv@main
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        shell: bash
        run: uv pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - name: Environment
        shell: bash
        run: python -c "import sys, torch, multiprocessing as m, torch.multiprocessing as tm; print(sys.version, torch.__version__, m.get_start_method(), tm.get_sharing_strategy())"
      - name: Stdlib spawn without torch
        if: always()
        shell: bash
        run: python .github/probe/plainmp.py
      - name: torch queue int
        if: always()
        shell: bash
        run: python .github/probe/tensor_queue.py int
      - name: torch queue tensor
        if: always()
        shell: bash
        run: python .github/probe/tensor_queue.py tensor
      - name: Minimal DataLoader num_workers=2
        if: always()
        shell: bash
        run: python .github/probe/dataloader.py
      - name: yolov5 train (CI command)
        if: always()
        shell: bash
        run: python train.py --imgsz 64 --batch 32 --weights yolov5n.pt --cfg yolov5n.yaml --epochs 1 --device cpu
